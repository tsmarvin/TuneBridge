name: 🐛 Bug Report
description: Report a bug or unexpected behavior in BridgeBeats
title: "[Bug]: "
labels: ["bug", "needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report this bug! Please fill out the information below to help us investigate and fix the issue.

  - type: textarea
    id: description
    attributes:
      label: Description
      description: A clear and concise description of what the bug is.
      placeholder: Describe the bug...
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Steps to Reproduce
      description: Detailed steps to reproduce the behavior.
      placeholder: |
        1. Go to '...'
        2. Click on '...'
        3. Enter '...'
        4. See error
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: What did you expect to happen?
      placeholder: Describe what should happen...
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual Behavior
      description: What actually happened?
      placeholder: Describe what actually happened...
    validations:
      required: true

  - type: dropdown
    id: component
    attributes:
      label: Component
      description: Which component is affected?
      options:
        - Web Interface
        - Discord Bot
        - API
        - Apple Music Integration
        - Spotify Integration
        - Tidal Integration
        - ATProto Integration
        - Docker/Deployment
        - Documentation
        - Other
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Version
      description: What version of BridgeBeats are you using? (e.g., latest, v1.0.0, commit SHA)
      placeholder: e.g., latest, v1.0.0
    validations:
      required: false

  - type: dropdown
    id: deployment
    attributes:
      label: Deployment Method
      description: How are you running BridgeBeats?
      options:
        - Docker Compose
        - Docker
        - .NET Aspire
        - Direct .NET Run
        - Cloud Service (Azure/AWS/GCP)
        - Kubernetes
        - Other
    validations:
      required: false

  - type: textarea
    id: environment
    attributes:
      label: Environment Details
      description: |
        Please provide relevant environment details:
        - OS and version
        - .NET version (if running locally)
        - Docker version (if using Docker)
        - Browser and version (for web interface issues)
      placeholder: |
        - OS: Ubuntu 22.04
        - .NET: 10.0
        - Browser: Chrome 120
    validations:
      required: false

  - type: textarea
    id: logs
    attributes:
      label: Logs and Error Messages
      description: Please include any relevant logs, error messages, or stack traces.
      placeholder: Paste logs here...
      render: shell
    validations:
      required: false

  - type: textarea
    id: additional
    attributes:
      label: Additional Context
      description: Add any other context about the problem here (screenshots, configuration snippets, etc.)
      placeholder: Any additional information...
    validations:
      required: false

  - type: checkboxes
    id: checklist
    attributes:
      label: Pre-submission Checklist
      description: Please confirm the following before submitting
      options:
        - label: I have searched for similar issues and found none
          required: true
        - label: I have checked the documentation
          required: false
        - label: I have included logs/error messages (if applicable)
          required: false
