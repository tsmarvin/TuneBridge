services:
  bridgebeats-bootstrap:
    image: tsmarvin/bridgebeats:develop
    container_name: bridgebeats-bootstrap
    restart: "no"
    network_mode: none
    entrypoint:
      - dotnet
      - /src/BridgeBeats.Bootstrap/BridgeBeats.Bootstrap.dll
      - /app/bootstrap
    volumes:
      - bridgebeats-bootstrap-secrets:/app/bootstrap

  bridgebeats:
    image: tsmarvin/bridgebeats:develop
    container_name: bridgebeats
    restart: unless-stopped
    depends_on:
      bridgebeats-bootstrap:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    networks:
      - internal
    environment:
      BridgeBeats__IdentityConnectionString: Data Source=/app/data/bridgebeats.db
      BridgeBeats__DataProtectionKeyPath: /app/keys
      BridgeBeats__LogDirPath: /app/data/logs
      BridgeBeats__NodeNumber: "0"
      BridgeBeats__Domain: bridgebeats.link
      DASHBOARD__FRONTEND__PUBLICURL: https://dashboard.bridgebeats.link
      Logging__LogLevel__Default: Information
      Logging__LogLevel__Microsoft.Hosting.Lifetime: Information
      # Loopback entries are required by the container healthcheck and internal worker calls.
      AllowedHosts: localhost;127.0.0.1;bridgebeats.link;www.bridgebeats.link;bbeats.link;www.bbeats.link;dashboard.bridgebeats.link
    volumes:
      - ./data/app:/app/data # Persistent data directory (sqlite + Aspire store)
      - ./logs:/app/data/logs # Logs bind-mounted to host for easy access
      - ./data/dp-keys:/app/keys # Required persistent Data Protection key ring
      - bridgebeats-bootstrap-secrets:/app/bootstrap:ro
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://localhost:10000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    deploy:
      resources:
        limits:
          cpus: '4'
          memory: 8G
        reservations:
          cpus: '0.5'
          memory: 256M

  redis:
    image: redis:8-alpine
    container_name: bridgebeats-redis
    restart: unless-stopped
    depends_on:
      bridgebeats-bootstrap:
        condition: service_completed_successfully
    networks:
      - internal
    group_add:
      - "1654" # Read-only access to the bootstrap credential created by the BridgeBeats image user.
    command:
      - sh
      - -c
      - |
        password=$$(head -n 1 /app/bootstrap/redis_password | tr -d '\015\012')
        printf 'requirepass %s\nappendonly yes\n' "$$password" > /tmp/redis.conf
        exec redis-server /tmp/redis.conf
    volumes:
      - ./data/redis:/data
      - bridgebeats-bootstrap-secrets:/app/bootstrap:ro
    healthcheck:
      test:
        - CMD-SHELL
        - |
          password=$$(head -n 1 /app/bootstrap/redis_password | tr -d '\015\012')
          REDISCLI_AUTH="$$password" redis-cli --no-auth-warning ping | grep -q PONG
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 6G
        reservations:
          cpus: '0.1'
          memory: 64M

  bridgebeats-pds:
    profiles:
      - pds
    image: ghcr.io/bluesky-social/pds:latest
    container_name: bridgebeats-pds
    restart: unless-stopped
    networks:
      - internal
    volumes:
      - ./data/pds:/pds
    environment:
      PDS_HOSTNAME: pds.bridgebeats.link
      PDS_JWT_SECRET: ""
      PDS_PLC_ROTATION_KEY_K256_PRIVATE_KEY_HEX: ""
      PDS_ADMIN_PASSWORD: ""
      PDS_DATA_DIRECTORY: /pds
      PDS_BLOBSTORE_DISK_LOCATION: /pds/blocks
      PDS_EMAIL_SMTP_URL: smtp://username:clientsecret@smtp.azurecomm.net:587/
      PDS_EMAIL_FROM_ADDRESS: admin@bridgebeats.link
      PDS_BLOB_UPLOAD_LIMIT: "52428800"
      PDS_DID_PLC_URL: https://plc.directory
      PDS_BSKY_APP_VIEW_URL: https://api.bsky.app
      PDS_BSKY_APP_VIEW_DID: did:web:api.bsky.app
      PDS_REPORT_SERVICE_URL: https://mod.bsky.app
      PDS_REPORT_SERVICE_DID: ""
      PDS_CRAWLERS: https://bsky.network
      LOG_ENABLED: "true"

  bridgebeats-caddy:
    image: tsmarvin/caddy-cloudflare:develop
    container_name: bridgebeats-caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    networks:
      - public
      - internal
    environment:
      DOMAIN: bridgebeats.link
      SHORT_DOMAIN: bbeats.link
      PDS_HOSTNAME: pds.bridgebeats.link
      CADDY_ADMIN_EMAIL: admin@bridgebeats.link
      CLOUDFLARE_API_TOKEN: ""
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - bridgebeats-caddy-data:/data/caddy
      - bridgebeats-caddy-config:/config/caddy
      - ./logs/caddy:/var/log/caddy

volumes:
  bridgebeats-bootstrap-secrets:
    driver: local
  bridgebeats-caddy-data:
    driver: local
  bridgebeats-caddy-config:
    driver: local

networks:
  public:
    driver: bridge

  internal:
    driver: bridge
