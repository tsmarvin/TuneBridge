services:
  tunebridge:
    image: tsmarvin/tunebridge-test:latest
    container_name: tunebridge
    restart: unless-stopped

    # Ports
    # Port 80: HTTP (will redirect to HTTPS in production)
    # Port 443: HTTPS (Caddy auto-manages certificates)
    ports:
      - "80:80"
      - "443:443"

    # Environment variables
    # Override these in a .env file or docker-compose.override.yml
    environment:
      # Domain configuration
      - DOMAIN=${DOMAIN:-dev.tunebridge.media}
      - CADDY_ADMIN_EMAIL=${CADDY_ADMIN_EMAIL:-admin@tunebridge.media}

      # TuneBridge configuration
      - NODE_NUMBER=${NODE_NUMBER:-0}
      - ALLOWED_HOSTS=${ALLOWED_HOSTS:-*}
      - DEFAULT_LOGLEVEL=${DEFAULT_LOGLEVEL:-Information}
      - HOSTING_DEFAULT_LOGLEVEL=${HOSTING_DEFAULT_LOGLEVEL:-Information}

      # Music provider credentials (at least one required)
      - APPLE_TEAM_ID=${APPLE_TEAM_ID:-}
      - APPLE_KEY_ID=${APPLE_KEY_ID:-}
      - APPLE_KEY_PATH=${APPLE_KEY_PATH:-/run/secrets/apple_key}
      - SPOTIFY_CLIENT_ID=${SPOTIFY_CLIENT_ID:-}
      - TIDAL_CLIENT_ID=${TIDAL_CLIENT_ID:-}

      # Optional Bluesky PDS configuration
      - BLUESKY_PDS_URL=${BLUESKY_PDS_URL:-} # https://bsky.social is the default if you don't have a custom PDS
      - BLUESKY_IDENTIFIER=${BLUESKY_IDENTIFIER:-}

      # Cache configuration
      - CACHE_DAYS=${CACHE_DAYS:-7}
      - LINK_CACHE_CONNECTION_STRING=${LINK_CACHE_CONNECTION_STRING:-Data Source=/app/data/tunebridge.db}

      # Database configuration
      - IDENTITY_CONNECTION_STRING=${IDENTITY_CONNECTION_STRING:-Data Source=/app/data/tunebridge.db}

      # Authentication and rate limiting
      - RATE_LIMIT_REQUESTS_PER_HOUR=${RATE_LIMIT_REQUESTS_PER_HOUR:-20}

    # Volumes
    volumes:
      # Persistent data directory
      - tunebridge-data:/app/data
      # Caddy data for certificates
      - caddy-data:/data/caddy
      - caddy-config:/config/caddy
      # Caddy logs
      - caddy-logs:/var/log/caddy
      # Secret mounts (read-only)
      - ./secrets/apple_key.p8:/run/secrets/apple_key:ro
      - ./secrets/spotify_client_secret.txt:/run/secrets/spotify_client_secret:ro
      - ./secrets/tidal_client_secret.txt:/run/secrets/tidal_client_secret:ro
      - ./secrets/discord_token.txt:/run/secrets/discord_token:ro
      - ./secrets/bluesky_password.txt:/run/secrets/bluesky_password:ro
      - ./secrets/api_key_salt.txt:/run/secrets/api_key_salt:ro

    # Health check
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:10000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

    # Resource limits (adjust as needed)
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 1G
        reservations:
          cpus: '0.5'
          memory: 256M

# Named volumes for data persistence
volumes:
  tunebridge-data:
    driver: local
  caddy-data:
    driver: local
  caddy-config:
    driver: local
  caddy-logs:
    driver: local
