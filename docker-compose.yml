version: '3.8'

services:
  tunebridge:
    build:
      context: .
      dockerfile: Dockerfile
    image: tunebridge:latest
    container_name: tunebridge
    restart: unless-stopped
    
    # Ports
    # Port 80: HTTP (will redirect to HTTPS in production)
    # Port 443: HTTPS (Caddy auto-manages certificates)
    # Port 10000: Direct access to TuneBridge (for development only)
    ports:
      - "80:80"
      - "443:443"
      - "10000:10000"  # Optional: Remove in production
    
    # Environment variables
    # Override these in a .env file or docker-compose.override.yml
    environment:
      # Domain configuration
      - DOMAIN=${DOMAIN:-dev.tunebridge.media}
      - CADDY_ADMIN_EMAIL=${CADDY_ADMIN_EMAIL:-admin@tunebridge.media}
      
      # TuneBridge configuration
      - NODE_NUMBER=${NODE_NUMBER:-0}
      - ALLOWED_HOSTS=${ALLOWED_HOSTS:-*}
      - DEFAULT_LOGLEVEL=${DEFAULT_LOGLEVEL:-Information}
      - HOSTING_DEFAULT_LOGLEVEL=${HOSTING_DEFAULT_LOGLEVEL:-Information}
      
      # Music provider credentials (at least one required)
      - APPLE_TEAM_ID=${APPLE_TEAM_ID:-}
      - APPLE_KEY_ID=${APPLE_KEY_ID:-}
      - APPLE_KEY_PATH=${APPLE_KEY_PATH:-/run/secrets/apple_key}
      - SPOTIFY_CLIENT_ID=${SPOTIFY_CLIENT_ID:-}
      - SPOTIFY_CLIENT_SECRET=${SPOTIFY_CLIENT_SECRET:-}
      - TIDAL_CLIENT_ID=${TIDAL_CLIENT_ID:-}
      - TIDAL_CLIENT_SECRET=${TIDAL_CLIENT_SECRET:-}
      
      # Optional Discord bot token
      - DISCORD_TOKEN=${DISCORD_TOKEN:-}
      
      # Optional Bluesky PDS configuration
      - BLUESKY_PDS_URL=${BLUESKY_PDS_URL:-https://bsky.social}
      - BLUESKY_IDENTIFIER=${BLUESKY_IDENTIFIER:-}
      - BLUESKY_PASSWORD=${BLUESKY_PASSWORD:-}
      
      # Cache configuration
      - CACHE_DAYS=${CACHE_DAYS:-7}
      - CACHE_DB_PATH=${CACHE_DB_PATH:-/app/data/medialinkscache.db}
      
      # Database configuration
      - CONNECTION_STRING=${CONNECTION_STRING:-Data Source=/app/data/tunebridge.db}
      
      # Authentication and rate limiting
      - API_KEY_SALT=${API_KEY_SALT:-}
      - RATE_LIMIT_REQUESTS_PER_HOUR=${RATE_LIMIT_REQUESTS_PER_HOUR:-20}
    
    # Docker secrets (preferred for sensitive data in production)
    secrets:
      - apple_key
      - spotify_client_secret
      - tidal_client_secret
      - discord_token
      - bluesky_password
      - api_key_salt
    
    # Volumes
    volumes:
      # Persistent data directory
      - tunebridge-data:/app/data
      # Caddy data for certificates
      - caddy-data:/data/caddy
      - caddy-config:/config/caddy
      # Caddy logs
      - caddy-logs:/var/log/caddy
      # Custom Caddyfile (optional override)
      # - ./Caddyfile:/etc/caddy/Caddyfile:ro
    
    # Health check
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:10000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    
    # Resource limits (adjust as needed)
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 1G
        reservations:
          cpus: '0.5'
          memory: 256M

# Docker secrets definitions
# Create these files with your actual secrets before running docker-compose
secrets:
  apple_key:
    file: ${APPLE_KEY_FILE:-./secrets/apple_key.p8}
  spotify_client_secret:
    file: ${SPOTIFY_CLIENT_SECRET_FILE:-./secrets/spotify_client_secret.txt}
  tidal_client_secret:
    file: ${TIDAL_CLIENT_SECRET_FILE:-./secrets/tidal_client_secret.txt}
  discord_token:
    file: ${DISCORD_TOKEN_FILE:-./secrets/discord_token.txt}
  bluesky_password:
    file: ${BLUESKY_PASSWORD_FILE:-./secrets/bluesky_password.txt}
  api_key_salt:
    file: ${API_KEY_SALT_FILE:-./secrets/api_key_salt.txt}

# Named volumes for data persistence
volumes:
  tunebridge-data:
    driver: local
  caddy-data:
    driver: local
  caddy-config:
    driver: local
  caddy-logs:
    driver: local
